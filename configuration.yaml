
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

mqtt:
  number:
    # ============================================================================
    # MQTT Number Entities for Birb CO2 Display
    # ============================================================================
    - name: "Birb CO2 Display"
      unique_id: birb_co2_set
      command_topic: "birb/co2/set"
      state_topic: "birb/co2/state"
      min: 420
      max: 2400
      step: 1
      mode: slider
      optimistic: true
      retain: true
      
    - name: "Birb Home CO2 Display"
      unique_id: birb_home_co2_set
      command_topic: "birb/co2/Birb-7F98A4/set"
      state_topic: "birb/co2/Birb-7F98A4/state"
      min: 420
      max: 2400
      step: 1
      mode: slider
      optimistic: true
      retain: true

  binary_sensor:
    # ============================================================================
    # Aranet Pro Base Station Availability Sensor
    # ============================================================================
    - name: "Aranet Pro Base Station"
      unique_id: aranet_base_364190009546_online
      state_topic: "AranetBaseFlow/364190009546/online"
      payload_on: "true"
      payload_off: "false"
      device_class: connectivity
      icon: mdi:access-point

    # ============================================================================
    # lcrelay Device Online/Offline Status
    # ============================================================================
    - name: "Aquarium fffe8a Relay Status"
      unique_id: "lcrelay_fffe8a_status"
      state_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      qos: 1
      icon: mdi:lan-connect


  sensor:
    # ============================================================================
    # SENSOR 1 - Update sensor_id and sensor_name for your first Aranet4 sensor
    # ============================================================================

    # Configuration variables for easy customization
    # sensor_id: 407C0D
    # sensor_name: 407C0D
    # base_station_id: 364190009546

    # CO2 Sensor
    - name: "Aranet4 407C0D CO2"
      unique_id: aranet4_407C0D_co2
      state_topic: "AranetBaseFlow/364190009546/sensors/407C0D/measurements/co2"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      icon: mdi:molecule-co2
      device:
        identifiers: ["aranet4_407C0D"]
        name: "Aranet4 407C0D"
        manufacturer: "SAF Tehnika"
        model: "Aranet4"

    # Temperature Sensor
    - name: "Aranet4 407C0D Temperature"
      unique_id: aranet4_407C0D_temperature
      state_topic: "AranetBaseFlow/364190009546/sensors/407C0D/measurements/temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer
      device:
        identifiers: ["aranet4_407C0D"]
        name: "Aranet4 407C0D"
        manufacturer: "SAF Tehnika"
        model: "Aranet4"

    # Humidity Sensor
    - name: "Aranet4 407C0D Humidity"
      unique_id: aranet4_407C0D_humidity
      state_topic: "AranetBaseFlow/364190009546/sensors/407C0D/measurements/humidity"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      icon: mdi:water-percent
      device:
        identifiers: ["aranet4_407C0D"]
        name: "Aranet4 407C0D"
        manufacturer: "SAF Tehnika"
        model: "Aranet4"

    # Atmospheric Pressure Sensor (converted to hPa)
    - name: "Aranet4 407C0D Pressure"
      unique_id: aranet4_407C0D_pressure
      state_topic: "AranetBaseFlow/364190009546/sensors/407C0D/measurements/atmosphericpressure"
      unit_of_measurement: "hPa"
      device_class: atmospheric_pressure
      state_class: measurement
      icon: mdi:gauge
      value_template: "{{ (value | float / 100) | round(1) }}"
      device:
        identifiers: ["aranet4_407C0D"]
        name: "Aranet4 407C0D"
        manufacturer: "SAF Tehnika"
        model: "Aranet4"

    # Battery Level Sensor (converted to percentage)
    - name: "Aranet4 407C0D Battery"
      unique_id: aranet4_407C0D_battery
      state_topic: "AranetBaseFlow/364190009546/sensors/407C0D/measurements/battery"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      icon: mdi:battery
      value_template: "{{ (value | float * 100) | round(0) }}"
      device:
        identifiers: ["aranet4_407C0D"]
        name: "Aranet4 407C0D"
        manufacturer: "SAF Tehnika"
        model: "Aranet4"

    # Signal Strength Sensor
    - name: "Aranet4 407C0D Signal"
      unique_id: aranet4_407C0D_rssi
      state_topic: "AranetBaseFlow/364190009546/sensors/407C0D/measurements/rssi"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      icon: mdi:wifi-strength-2
      device:
        identifiers: ["aranet4_407C0D"]
        name: "Aranet4 407C0D"
        manufacturer: "SAF Tehnika"
        model: "Aranet4"

    # Last Update Timestamp
    - name: "Aranet4 407C0D Last Update"
      unique_id: aranet4_407C0D_timestamp
      state_topic: "AranetBaseFlow/364190009546/sensors/407C0D/measurements/time"
      device_class: timestamp
      icon: mdi:clock-outline
      value_template: "{{ value | int | timestamp_local }}"
      device:
        identifiers: ["aranet4_407C0D"]
        name: "Aranet4 407C0D"
        manufacturer: "SAF Tehnika"
        model: "Aranet4"

    # ============================================================================
    # Birb Sensors
    # ============================================================================
    - name: "Birb 7F98A4 Servo Position"
      state_topic: "birb/sensor/Birb-7F98A4/Birb-7F98A4_servo_position/state"
      unit_of_measurement: "°"
    - name: "Birb 7F98A4 Battery"
      state_topic: "birb/sensor/Birb-7F98A4/Birb-7F98A4_battery/state"
      unit_of_measurement: "%"
    - name: "Birb 7F98A4 Battery Voltage"
      state_topic: "birb/sensor/Birb-7F98A4/Birb-7F98A4_battery_voltage/state"
      unit_of_measurement: "V"

    - name: "Birb 8A278C Servo Position"
      state_topic: "birb/sensor/Birb-8A278C/Birb-8A278C_servo_position/state"
      unit_of_measurement: "°"
    - name: "Birb 8A278C Battery"
      state_topic: "birb/sensor/Birb-8A278C/Birb-8A278C_battery/state"
      unit_of_measurement: "%"
    - name: "Birb 8A278C Battery Voltage"
      state_topic: "birb/sensor/Birb-8A278C/Birb-8A278C_battery_voltage/state"
      unit_of_measurement: "V"
      
    - name: "Birb 610990 Servo Position"
      state_topic: "birb/sensor/Birb-610990/Birb-610990_servo_position/state"
      unit_of_measurement: "°"
    - name: "Birb 610990 Battery"
      state_topic: "birb/sensor/Birb-610990/Birb-610990_battery/state"
      unit_of_measurement: "%"
    - name: "Birb 610990 Battery Voltage"
      state_topic: "birb/sensor/Birb-610990/Birb-610990_battery_voltage/state"
      unit_of_measurement: "V"
   
    # ============================================================================
    # lcrelay-fffe8a Sensors
    # ============================================================================
    # Temperature Sensor
    - name: "Aquarium fffe8a Temperature"
      unique_id: "lcrelay_fffe8a_temperature"
      state_topic: "flow/aquarium/lcrelay/fffe8a/telemetry/temperature"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      qos: 0
      icon: mdi:thermometer

    # WiFi Signal Strength
    - name: "Aquarium fffe8a Relay WiFi RSSI"
      unique_id: "lcrelay_fffe8a_wifi_rssi"
      state_topic: "flow/aquarium/lcrelay/fffe8a/telemetry/wifi_rssi"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      qos: 0
      icon: mdi:wifi

    # WiFi SSID
    - name: "Aquarium fffe8a Relay WiFi Network"
      unique_id: "lcrelay_fffe8a_wifi_ssid"
      state_topic: "flow/aquarium/lcrelay/fffe8a/telemetry/wifi_ssid"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 0
      icon: mdi:access-point-network

    # IP Address
    - name: "Aquarium fffe8a Relay IP Address"
      unique_id: "lcrelay_fffe8a_ip_address"
      state_topic: "flow/aquarium/lcrelay/fffe8a/telemetry/ip_address"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 0
      icon: mdi:ip-network

    # ============================================================================
    # Sensors - Diagnostics
    # ============================================================================

    # Free Heap Memory
    - name: "Aquarium fffe8a Relay Heap Free"
      unique_id: "lcrelay_fffe8a_heap_free"
      state_topic: "flow/aquarium/lcrelay/fffe8a/diagnostics/heap_free"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: data_size
      state_class: measurement
      qos: 0
      icon: mdi:memory
      # Convert to KB for display
      value_template: "{{ (value | int / 1024) | round(1) }}"
      unit_of_measurement: "kB"

    # Minimum Free Heap
    - name: "Aquarium fffe8a Relay Heap Min"
      unique_id: "lcrelay_fffe8a_heap_min"
      state_topic: "flow/aquarium/lcrelay/fffe8a/diagnostics/heap_min"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: data_size
      state_class: measurement
      qos: 0
      icon: mdi:memory
      value_template: "{{ (value | int / 1024) | round(1) }}"
      unit_of_measurement: "kB"

    # Largest Free Block
    - name: "Aquarium fffe8a Relay Heap Largest"
      unique_id: "lcrelay_fffe8a_heap_largest"
      state_topic: "flow/aquarium/lcrelay/fffe8a/diagnostics/heap_largest"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: data_size
      state_class: measurement
      qos: 0
      icon: mdi:memory
      value_template: "{{ (value | int / 1024) | round(1) }}"
      unit_of_measurement: "kB"

    # System Uptime
    - name: "Aquarium fffe8a Relay Uptime"
      unique_id: "lcrelay_fffe8a_uptime"
      state_topic: "flow/aquarium/lcrelay/fffe8a/diagnostics/uptime"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      qos: 0
      icon: mdi:clock-outline
      # Convert to human-readable format
      value_template: >-
        {% set seconds = value | int %}
        {% set days = (seconds / 86400) | int %}
        {% set hours = ((seconds % 86400) / 3600) | int %}
        {% set minutes = ((seconds % 3600) / 60) | int %}
        {% if days > 0 %}
          {{ days }}d {{ hours }}h
        {% elif hours > 0 %}
          {{ hours }}h {{ minutes }}m
        {% else %}
          {{ minutes }}m
        {% endif %}

    # WiFi Uptime
    - name: "Aquarium fffe8a Relay WiFi Uptime"
      unique_id: "lcrelay_fffe8a_wifi_uptime"
      state_topic: "flow/aquarium/lcrelay/fffe8a/diagnostics/wifi_uptime"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      qos: 0
      icon: mdi:wifi-check
      value_template: >-
        {% set seconds = value | int %}
        {% set hours = (seconds / 3600) | int %}
        {% set minutes = ((seconds % 3600) / 60) | int %}
        {% if hours > 0 %}
          {{ hours }}h {{ minutes }}m
        {% else %}
          {{ minutes }}m
        {% endif %}

    # MQTT Uptime
    - name: "Aquarium fffe8a Relay MQTT Uptime"
      unique_id: "lcrelay_fffe8a_mqtt_uptime"
      state_topic: "flow/aquarium/lcrelay/fffe8a/diagnostics/mqtt_uptime"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      qos: 0
      icon: mdi:swap-vertical
      value_template: >-
        {% set seconds = value | int %}
        {% set hours = (seconds / 3600) | int %}
        {% set minutes = ((seconds % 3600) / 60) | int %}
        {% if hours > 0 %}
          {{ hours }}h {{ minutes }}m
        {% else %}
          {{ minutes }}m
        {% endif %}

  # ============================================================================
  # Relay Switches (4 channels)
  # ============================================================================

  switch:
    # Relay 1
    - name: "Aquarium fffe8a Relay 1"
      unique_id: "lcrelay_fffe8a_relay1"
      state_topic: "flow/aquarium/lcrelay/fffe8a/state/relay1"
      command_topic: "flow/aquarium/lcrelay/fffe8a/command/relay1"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_on: "ON"
      payload_off: "OFF"
      payload_available: "online"
      payload_not_available: "offline"
      state_on: "ON"
      state_off: "OFF"
      optimistic: false
      qos: 1
      retain: true
      icon: mdi:electric-switch

    # Relay 2
    - name: "Aquarium fffe8a Relay 2"
      unique_id: "lcrelay_fffe8a_relay2"
      state_topic: "flow/aquarium/lcrelay/fffe8a/state/relay2"
      command_topic: "flow/aquarium/lcrelay/fffe8a/command/relay2"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_on: "ON"
      payload_off: "OFF"
      payload_available: "online"
      payload_not_available: "offline"
      state_on: "ON"
      state_off: "OFF"
      optimistic: false
      qos: 1
      retain: true
      icon: mdi:electric-switch

    # Relay 3
    - name: "Aquarium fffe8a Relay 3"
      unique_id: "lcrelay_fffe8a_relay3"
      state_topic: "flow/aquarium/lcrelay/fffe8a/state/relay3"
      command_topic: "flow/aquarium/lcrelay/fffe8a/command/relay3"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_on: "ON"
      payload_off: "OFF"
      payload_available: "online"
      payload_not_available: "offline"
      state_on: "ON"
      state_off: "OFF"
      optimistic: false
      qos: 1
      retain: true
      icon: mdi:electric-switch

    # Relay 4
    - name: "Aquarium fffe8a Relay 4"
      unique_id: "lcrelay_fffe8a_relay4"
      state_topic: "flow/aquarium/lcrelay/fffe8a/state/relay4"
      command_topic: "flow/aquarium/lcrelay/fffe8a/command/relay4"
      availability_topic: "flow/aquarium/lcrelay/fffe8a/availability"
      payload_on: "ON"
      payload_off: "OFF"
      payload_available: "online"
      payload_not_available: "offline"
      state_on: "ON"
      state_off: "OFF"
      optimistic: false
      qos: 1
      retain: true
      icon: mdi:electric-switch

sensor:
  - platform: filter
    name: "Aranet CO2 3min Avg (Filter)"
    # entity_id: sensor.aranet4_boaz_2bfd5_carbon_dioxide
    # entity_id: sensor.birb_co2_set
    entity_id: sensor.birb_co2_sensor
    filters:
      - filter: time_simple_moving_average
        window_size: "00:01:00" 
        precision: 0

