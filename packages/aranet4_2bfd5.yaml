mqtt:
  sensor:
    - name: "Birb Aranet4 2bfd5 CO2"
      unique_id: birb_aranet4_2bfd5_co2
      state_topic: "flow/aranet4/2bfd5/telemetry"
      value_template: "{{ value_json.co2 | int }}"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2bfd5"]

    - name: "Birb Aranet4 2bfd5 Temperature"
      unique_id: birb_aranet4_2bfd5_temperature
      state_topic: "flow/aranet4/2bfd5/telemetry"
      value_template: "{{ value_json.temperature | round(2) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2bfd5"]

    - name: "Birb Aranet4 2bfd5 Humidity"
      unique_id: birb_aranet4_2bfd5_humidity
      state_topic: "flow/aranet4/2bfd5/telemetry"
      value_template: "{{ value_json.humidity }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2bfd5"]

    - name: "Birb Aranet4 2bfd5 Pressure"
      unique_id: birb_aranet4_2bfd5_temperature
      state_topic: "flow/aranet4/2bfd5/telemetry"
      value_template: "{{ value_json.pressure }}"
      unit_of_measurement: "hPa"
      device_class: atmospheric_pressure
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2bfd5"]

    - name: "Birb Aranet4 2bfd5 Battery"
      unique_id: birb_aranet4_2bfd5_battery
      state_topic: "flow/aranet4/2bfd5/telemetry"
      value_template: "{{ value_json.battery }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2bfd5"]

    - name: "Birb Aranet4 2bfd5 RSSI"
      unique_id: birb_aranet4_2bfd5_rssi
      state_topic: "flow/aranet4/2bfd5/telemetry"
      value_template: "{{ value_json.rssi }}"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2bfd5"]

    - name: "Birb Aranet4 2bfd5 Last Update"
      unique_id: birb_aranet4_2bfd5_last_update
      state_topic: "flow/aranet4/2bfd5/telemetry"
      value_template: "{{ value_json.timestamp }}"
      device_class: timestamp
      device:
        identifiers: ["birb_aranet4_2bfd5"]

    - name: "Birb Aranet4 2bfd5 Gateway"
      unique_id: birb_aranet4_2bfd5_gateway
      state_topic: "birb/Birb-7F98A4/telemetry"
      icon: mdi:access-point
      entity_category: diagnostic
      value_template: "{{ value_json.gateway }}"
      device:
        identifiers: ["birb_aranet4_2bfd5"]
        name: "Birb Aranet4 2bfd5"
        model: "Birb Aranet4"
        manufacturer: "Boaz"
