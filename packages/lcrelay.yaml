    - name: "Aquarium Aranet4 Battery"
      unique_id: "lcrelay_aranet4_07c99_battery"
      state_topic: "flow/aquarium/lcrelay/8a23d8/aranet4/07c99/battery"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
