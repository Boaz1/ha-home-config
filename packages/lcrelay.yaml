      json_attributes_template: >
        {{ {"unit": value_json.unit, "time": value_json.time} | tojson }}
      device:
        identifiers: ["lcrelay_aranet4_07c99"]

    - name: "Aquarium Aranet4 RSSI"
      unique_id: "lcrelay_aranet4_07c99_rssi"
      state_topic: "flow/aquarium/lcrelay/8a23d8/aranet4/07c99/rssi"
