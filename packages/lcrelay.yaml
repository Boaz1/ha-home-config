    - name: "Aquarium 8a23d8 Relay 1"
      unique_id: "lcrelay_8a23d8_relay1"
      state_topic: "flow/aquarium/lcrelay/8a23d8/state/relay1"
      command_topic: "flow/aquarium/lcrelay/8a23d8/command/relay1"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_on: "ON"
      payload_off: "OFF"
      payload_available: "online"
