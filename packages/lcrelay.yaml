mqtt:

  binary_sensor:          
    # ============================================================================
    # lcrelay Device Online/Offline Status
    # ============================================================================
    - name: "Aquarium 8a23d8 Relay Status"
      unique_id: "lcrelay_8a23d8_status"
      state_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      qos: 1
      icon: mdi:lan-connect


  sensor:
    # ============================================================================
    # lcrelay-8a23d8 Sensors
    # ============================================================================
    # Temperature Sensor
    - name: "Aquarium 8a23d8 Temperature"
      unique_id: "lcrelay_8a23d8_temperature"
      state_topic: "flow/aquarium/lcrelay/8a23d8/telemetry/temperature"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      qos: 0
      icon: mdi:thermometer

    # WiFi Signal Strength
    - name: "Aquarium 8a23d8 Relay WiFi RSSI"
      unique_id: "lcrelay_8a23d8_wifi_rssi"
      state_topic: "flow/aquarium/lcrelay/8a23d8/telemetry/wifi_rssi"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      qos: 0
      icon: mdi:wifi

    # WiFi SSID
    - name: "Aquarium 8a23d8 Relay WiFi Network"
      unique_id: "lcrelay_8a23d8_wifi_ssid"
      state_topic: "flow/aquarium/lcrelay/8a23d8/telemetry/wifi_ssid"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 0
      icon: mdi:access-point-network

    # IP Address
    - name: "Aquarium 8a23d8 Relay IP Address"
      unique_id: "lcrelay_8a23d8_ip_address"
      state_topic: "flow/aquarium/lcrelay/8a23d8/telemetry/ip_address"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      qos: 0
      icon: mdi:ip-network

    # ============================================================================
    # Sensors - Diagnostics
    # ============================================================================

    # Free Heap Memory
    - name: "Aquarium 8a23d8 Relay Heap Free"
      unique_id: "lcrelay_8a23d8_heap_free"
      state_topic: "flow/aquarium/lcrelay/8a23d8/diagnostics/heap_free"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: data_size
      state_class: measurement
      qos: 0
      icon: mdi:memory
      # Convert to KB for display
      value_template: "{{ (value | int / 1024) | round(1) }}"
      unit_of_measurement: "kB"

    # Minimum Free Heap
    - name: "Aquarium 8a23d8 Relay Heap Min"
      unique_id: "lcrelay_8a23d8_heap_min"
      state_topic: "flow/aquarium/lcrelay/8a23d8/diagnostics/heap_min"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: data_size
      state_class: measurement
      qos: 0
      icon: mdi:memory
      value_template: "{{ (value | int / 1024) | round(1) }}"
      unit_of_measurement: "kB"

    # Largest Free Block
    - name: "Aquarium 8a23d8 Relay Heap Largest"
      unique_id: "lcrelay_8a23d8_heap_largest"
      state_topic: "flow/aquarium/lcrelay/8a23d8/diagnostics/heap_largest"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device_class: data_size
      state_class: measurement
      qos: 0
      icon: mdi:memory
      value_template: "{{ (value | int / 1024) | round(1) }}"
      unit_of_measurement: "kB"

    # System Uptime
    - name: "Aquarium 8a23d8 Relay Uptime"
      unique_id: "lcrelay_8a23d8_uptime"
      state_topic: "flow/aquarium/lcrelay/8a23d8/diagnostics/uptime"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      qos: 0
      icon: mdi:clock-outline
      # Convert to human-readable format
      value_template: >-
        {% set seconds = value | int %}
        {% set days = (seconds / 86400) | int %}
        {% set hours = ((seconds % 86400) / 3600) | int %}
        {% set minutes = ((seconds % 3600) / 60) | int %}
        {% if days > 0 %}
          {{ days }}d {{ hours }}h
        {% elif hours > 0 %}
          {{ hours }}h {{ minutes }}m
        {% else %}
          {{ minutes }}m
        {% endif %}

    # WiFi Uptime
    - name: "Aquarium 8a23d8 Relay WiFi Uptime"
      unique_id: "lcrelay_8a23d8_wifi_uptime"
      state_topic: "flow/aquarium/lcrelay/8a23d8/diagnostics/wifi_uptime"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      qos: 0
      icon: mdi:wifi-check
      value_template: >-
        {% set seconds = value | int %}
        {% set hours = (seconds / 3600) | int %}
        {% set minutes = ((seconds % 3600) / 60) | int %}
        {% if hours > 0 %}
          {{ hours }}h {{ minutes }}m
        {% else %}
          {{ minutes }}m
        {% endif %}

    # MQTT Uptime
    - name: "Aquarium 8a23d8 Relay MQTT Uptime"
      unique_id: "lcrelay_8a23d8_mqtt_uptime"
      state_topic: "flow/aquarium/lcrelay/8a23d8/diagnostics/mqtt_uptime"
      availability_topic: "flow/aquarium/lcrelay/8a23d8/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      qos: 0
      icon: mdi:swap-vertical
      value_template: >-
        {% set seconds = value | int %}
        {% set hours = (seconds / 3600) | int %}
        {% set minutes = ((seconds % 3600) / 60) | int %}
        {% if hours > 0 %}
          {{ hours }}h {{ minutes }}m
        {% else %}
          {{ minutes }}m
        {% endif %}



    ##########################################################################################
    # LCrelay Aranet4
    ##########################################################################################
    - name: "LCrelay Aranet4 CO2"
      unique_id: "lcrelay_aranet4_07c99_co2"
      state_topic: "flow/aquarium/lcrelay/8a23d8/aranet4/07c99/co2"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      json_attributes_topic: "flow/aquarium/lcrelay/8a23d8/aranet4/07c99/co2"
      json_attributes_template: >
        {{ {"unit": value_json.unit, "time": value_json.time} | tojson }}
      device:
        identifiers: ["lcrelay_aranet4_07c99"]
        name: "LCrelay Aranet4 07c99"
        manufacturer: "Aranet"
        model: "Aranet4"
        suggested_area: "Aquarium"

    - name: "LCrelay Aranet4 Temperature"
      unique_id: "lcrelay_aranet4_07c99_temperature"
      state_topic: "flow/aquarium/lcrelay/8a23d8/aranet4/07c99/temperature"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      json_attributes_topic: "flow/aquarium/lcrelay/8a23d8/aranet4/07c99/temperature"
