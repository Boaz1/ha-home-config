        identifiers: ["lcrelay_aranet4_07c99"]

    - name: "Aquarium Aranet4 Pressure"
      unique_id: "lcrelay_aranet4_07c99_pressure"
      state_topic: "flow/aquarium/lcrelay/8a23d8/aranet4/07c99/pressure"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "hPa"
      device_class: atmospheric_pressure
