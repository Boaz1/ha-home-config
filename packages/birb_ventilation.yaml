# Home Assistant MQTT Configuration for CO2 Monitoring and Servo Control
# Add this to your configuration.yaml or include it as a package

#Input number to track current servo position
# input_number:
  # birb_servo_position:
    # name: "Birb Servo Position"
    # min: 0
    # max: 180
    # step: 90
    # initial: 0
    # mode: box

# Sensor for CO2 3-minute average
sensor:
  - platform: statistics
    name: "Aranet CO2 3min Average"
    entity_id: sensor.aranet4_407C0D_co2  # Replace with your actual Aranet CO2 sensor entity ID
    state_characteristic: mean
    sampling_size: 36  # 3 minutes worth of samples (assuming 5-second updates)
    max_age:
      minutes: 1
      # minutes: 3

# MQTT publish for CO2 state
# mqtt:
  # sensor:
    # - name: "Birb CO2 State"
      # state_topic: "birb/sensor/co2/state"
      # unit_of_measurement: "ppm"

# Automations for servo control and MQTT publishing
automation:
  # Publish CO2 state to MQTT
  - id: publish_co2_state
    alias: "Publish Aranet CO2 to MQTT"
    trigger:
      - platform: state
        entity_id: sensor.aranet4_407C0D_co2  # Replace with your actual Aranet CO2 sensor entity ID
    action:
      - service: mqtt.publish
        data:
          topic: "birb/sensor/co2/state"
          payload: "{{ states('sensor.aranet_co2') }}"
          retain: true

  # Servo control logic based on CO2 average
  - id: servo_control_increase_to_90
    alias: "Servo: Increase to 90 when CO2 > 900"
    trigger:
      - platform: state
        entity_id: sensor.aranet_co2_3min_average
    condition:
      - condition: numeric_state
        entity_id: input_number.birb_servo_position
        below: 90
      - condition: numeric_state
        entity_id: sensor.aranet_co2_3min_average
        above: 900
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.birb_servo_position
        data:
          value: 90
      - service: mqtt.publish
        data:
          topic: "birb/servo/set"
          payload: "90"
          retain: true

  - id: servo_control_increase_to_180
    alias: "Servo: Increase to 180 when CO2 > 1100"
    trigger:
      - platform: state
        entity_id: sensor.aranet_co2_3min_average
    condition:
      - condition: numeric_state
        entity_id: input_number.birb_servo_position
        below: 180
      - condition: numeric_state
        entity_id: sensor.aranet_co2_3min_average
        above: 1100
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.birb_servo_position
        data:
          value: 180
      - service: mqtt.publish
        data:
          topic: "birb/servo/set"
          payload: "180"
          retain: true

  - id: servo_control_decrease_to_90
    alias: "Servo: Decrease to 90 when CO2 < 1000"
    trigger:
      - platform: state
        entity_id: sensor.aranet_co2_3min_average
    condition:
      - condition: numeric_state
        entity_id: input_number.birb_servo_position
        above: 90
      - condition: numeric_state
        entity_id: sensor.aranet_co2_3min_average
        below: 1000
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.birb_servo_position
        data:
          value: 90
      - service: mqtt.publish
        data:
          topic: "birb/servo/set"
          payload: "90"
          retain: true

  - id: servo_control_decrease_to_0
    alias: "Servo: Decrease to 0 when CO2 < 700"
    trigger:
      - platform: state
        entity_id: sensor.aranet_co2_3min_average
    condition:
      - condition: numeric_state
        entity_id: input_number.birb_servo_position
        above: 0
      - condition: numeric_state
        entity_id: sensor.aranet_co2_3min_average
        below: 700
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.birb_servo_position
        data:
          value: 0
      - service: mqtt.publish
        data:
          topic: "birb/servo/set"
          payload: "0"
          retain: true

  # Publish initial servo state on Home Assistant start
  - id: publish_initial_servo_state
    alias: "Publish Initial Servo State"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "birb/servo/set"
          payload: "{{ states('input_number.birb_servo_position') | int }}"
          retain: true
