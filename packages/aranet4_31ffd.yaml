mqtt:
  sensor:
    - name: "Birb Aranet4 31ffd CO2"
      unique_id: birb_aranet4_31ffd_co2
      state_topic: "flow/aranet4/31ffd/telemetry"
      value_template: "{{ value_json.co2 }}"
      unit_of_measurement: "ppm"
      expire_after: 300
      device_class: carbon_dioxide
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_31ffd"]

    - name: "Birb Aranet4 31ffd Temperature"
      unique_id: birb_aranet4_31ffd_temperature
      state_topic: "flow/aranet4/31ffd/telemetry"
      value_template: "{{ value_json.temperature | round(2) }}"
      unit_of_measurement: "°C"
      expire_after: 300
      device_class: temperature
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_31ffd"]

    - name: "Birb Aranet4 31ffd Humidity"
      unique_id: birb_aranet4_31ffd_humidity
      state_topic: "flow/aranet4/31ffd/telemetry"
      value_template: "{{ value_json.humidity }}"
      unit_of_measurement: "%"
      expire_after: 300
      device_class: humidity
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_31ffd"]

    - name: "Birb Aranet4 31ffd Pressure"
      unique_id: birb_aranet4_31ffd_pressure
      state_topic: "flow/aranet4/31ffd/telemetry"
      value_template: "{{ value_json.pressure }}"
      unit_of_measurement: "hPa"
      expire_after: 300
      device_class: atmospheric_pressure
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_31ffd"]

    - name: "Birb Aranet4 31ffd Battery"
      unique_id: birb_aranet4_31ffd_battery
      state_topic: "flow/aranet4/31ffd/telemetry"
      value_template: "{{ value_json.battery }}"
      unit_of_measurement: "%"
      expire_after: 300
      device_class: battery
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_31ffd"]

    - name: "Birb Aranet4 31ffd RSSI"
      unique_id: birb_aranet4_31ffd_rssi
      state_topic: "flow/aranet4/31ffd/telemetry"
      value_template: "{{ value_json.rssi }}"
      unit_of_measurement: "dBm"
      expire_after: 300
      device_class: signal_strength
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_31ffd"]

    - name: "Birb Aranet4 31ffd Last Update"
      unique_id: birb_aranet4_31ffd_last_update
      state_topic: "flow/aranet4/31ffd/telemetry"
      value_template: "{{ value_json.timestamp }}"
      device_class: timestamp
      device:
        identifiers: ["birb_aranet4_31ffd"]

    - name: "Birb Aranet4 31ffd Gateway"
      unique_id: birb_aranet4_31ffd_gateway
      state_topic: "birb/Birb-7F98A4/telemetry"
      icon: mdi:access-point
      entity_category: diagnostic
      value_template: "{{ value_json.gateway }}"
      device:
        identifiers: ["birb_aranet4_31ffd"]
        name: "Birb Aranet4 31ffd Dan"
        model: "Birb Aranet4"
        manufacturer: "Boaz"
