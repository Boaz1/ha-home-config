mqtt:
  sensor:
    - name: "Birb Aranet4 07C0D CO2"
      unique_id: birb_aranet4_07c0d_co2
      state_topic: "flow/aranet4/07c0d/telemetry"
      value_template: "{{ value_json.co2 }}"
      unit_of_measurement: "ppm"
      expire_after: 300
      device_class: carbon_dioxide
      state_class: measurement
      device:
        identifiers: ["birb_aranet4 _07c0d"]

    - name: "Birb Aranet4 07C0D Temperature"
      unique_id: birb_aranet4_07c0d_temperature
      state_topic: "flow/aranet4/07c0d/telemetry"
      value_template: "{{ value_json.temperature | round(2) }}"
      unit_of_measurement: "°C"
      expire_after: 300
      device_class: temperature
      state_class: measurement
      device:
        identifiers: ["birb_aranet4 _07c0d"]

    - name: "Birb Aranet4 07C0D Humidity"
      unique_id: birb_aranet4_07c0d_humidity
      state_topic: "flow/aranet4/07c0d/telemetry"
      value_template: "{{ value_json.humidity }}"
      unit_of_measurement: "%"
      expire_after: 300
      device_class: humidity
      state_class: measurement
      device:
        identifiers: ["birb_aranet4 _07c0d"]

    - name: "Birb Aranet4 07C0D Pressure"
      unique_id: birb_aranet4_07c0d_pressure
      state_topic: "flow/aranet4/07c0d/telemetry"
      value_template: "{{ value_json.pressure }}"
      unit_of_measurement: "hPa"
      expire_after: 300
      device_class: atmospheric_pressure
      state_class: measurement
      device:
        identifiers: ["birb_aranet4 _07c0d"]

    - name: "Birb Aranet4 07C0D Battery"
      unique_id: birb_aranet4_07c0d_battery
      state_topic: "flow/aranet4/07c0d/telemetry"
      value_template: "{{ value_json.battery }}"
      unit_of_measurement: "%"
      expire_after: 300
      device_class: battery
      state_class: measurement
      device:
        identifiers: ["birb_aranet4 _07c0d"]

    - name: "Birb Aranet4 07C0D RSSI"
      unique_id: birb_aranet4_07c0d_rssi
      state_topic: "flow/aranet4/07c0d/telemetry"
      value_template: "{{ value_json.rssi }}"
      unit_of_measurement: "dBm"
      expire_after: 300
      device_class: signal_strength
      state_class: measurement
      device:
        identifiers: ["birb_aranet4 _07c0d"]

    - name: "Birb Aranet4 07C0D Last Update"
      unique_id: birb_aranet4_07c0d_last_update
      state_topic: "flow/aranet4/07c0d/telemetry"
      value_template: "{{ value_json.timestamp }}"
      device_class: timestamp
      device:
        identifiers: ["birb_aranet4 _07c0d"]

    - name: "Birb Aranet4 07c0d Gateway"
      unique_id: birb_aranet4_07c0d_gateway
      state_topic: "birb/Birb-7F98A4/telemetry"
      icon: mdi:access-point
      entity_category: diagnostic
      value_template: "{{ value_json.gateway }}"
      device:
        identifiers: ["birb_aranet4 _07c0d"]
        name: "Birb Aranet4 07C0D Flow Essraum"
        model: "Birb Aranet4"
        manufacturer: "Boaz"
