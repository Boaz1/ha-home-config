mqtt:
  sensor:
    - name: "Birb Aranet4 2cd44 CO2"
      unique_id: birb_aranet4_2cd44_co2
      state_topic: "flow/aranet4/2cd44/telemetry"
      value_template: "{{ value_json.co2 | int }}"
      unit_of_measurement: "ppm"
      device_class: carbon_dioxide
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2cd44"]

    - name: "Birb Aranet4 2cd44 Temperature"
      unique_id: birb_aranet4_2cd44_temperature
      state_topic: "flow/aranet4/2cd44/telemetry"
      value_template: "{{ value_json.temperature | round(2) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2cd44"]

    - name: "Birb Aranet4 2cd44 Humidity"
      unique_id: birb_aranet4_2cd44_humidity
      state_topic: "flow/aranet4/2cd44/telemetry"
      value_template: "{{ value_json.humidity }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2cd44"]

    - name: "Birb Aranet4 2cd44 Pressure"
      unique_id: birb_aranet4_2cd44_temperature
      state_topic: "flow/aranet4/2cd44/telemetry"
      value_template: "{{ value_json.pressure }}"
      unit_of_measurement: "hPa"
      device_class: atmospheric_pressure
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2cd44"]

    - name: "Birb Aranet4 2cd44 Battery"
      unique_id: birb_aranet4_2cd44_battery
      state_topic: "flow/aranet4/2cd44/telemetry"
      value_template: "{{ value_json.battery }}"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2cd44"]

    - name: "Birb Aranet4 2cd44 RSSI"
      unique_id: birb_aranet4_2cd44_rssi
      state_topic: "flow/aranet4/2cd44/telemetry"
      value_template: "{{ value_json.rssi }}"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      device:
        identifiers: ["birb_aranet4_2cd44"]

    - name: "Birb Aranet4 2cd44 Last Update"
      unique_id: birb_aranet4_2cd44_last_update
      state_topic: "flow/aranet4/2cd44/telemetry"
      value_template: "{{ value_json.timestamp }}"
      device_class: timestamp
      device:
        identifiers: ["birb_aranet4_2cd44"]

    - name: "Birb Aranet4 2cd44 Gateway"
      unique_id: birb_aranet4_2cd44_gateway
      state_topic: "birb/Birb-7F98A4/telemetry"
      icon: mdi:access-point
      entity_category: diagnostic
      value_template: "{{ value_json.gateway }}"
      device:
        identifiers: ["birb_aranet4_2cd44"]
        name: "Birb Aranet4 2cd44"
        model: "Birb Aranet4"
        manufacturer: "Boaz"
